<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html">
<h:head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
	<title>Formulário de Cadastro</title>
	<h:outputStylesheet library="_css" name="main.css" />
</h:head>
<h:body>
	<h:form styleClass="form-container">
		<h1>Cadastro</h1>

		<div class="form-group">
			<h:outputLabel for="nome" value="Nome:" />
			<h:inputText id="nome" value="#{usuarioBean.nome}" required="true" />
		</div>

		<div class="form-group">
			<h:outputLabel for="sobrenome" value="Sobrenome:" />
			<h:inputText id="sobrenome" value="#{usuarioBean.sobrenome}"
				required="true" />
		</div>

		<div class="form-group">
			<h:outputLabel for="telefone" value="Telefone:" />
			<h:inputText id="telefone" value="#{usuarioBean.telefone}"
				required="true" />
		</div>

		<div class="form-group">
			<h:outputLabel for="email" value="E-mail:" />
			<h:inputText id="email" value="#{usuarioBean.email}" required="true" />
		</div>

		<h:panelGroup layout="block" class="panel-group">
			<h:commandButton value="Salvar" action="#{usuarioBean.salvar}"
				styleClass="btn-salvar" />
			<h:commandButton value="Limpar" action="#{usuarioBean.limpar}"
				styleClass="btn-limpar" />
		</h:panelGroup>

		<h:panelGroup rendered="#{not empty usuarioBean.mensagem}"
			layout="block">
			<h:outputText value="#{usuarioBean.mensagem}"
				styleClass="mensagem-retorno" />
		</h:panelGroup>
	</h:form>
</h:body>
</html>
