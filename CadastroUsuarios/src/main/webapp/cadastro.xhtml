<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<h:head>
    <title>Cadastro</title>
    <h:outputStylesheet library="_css" name="main.css"/>
</h:head>
<h:body>
	<!-- Formulário de cadastro -->
    <div class="form-container">
        <h:form>
            <h2>Cadastro</h2>

            <div class="form-group">
                <h:outputLabel for="nome" value="Nome:" />
                <h:inputText id="nome" value="#{pessoaBean.nome}" required="true" />
            </div>

            <div class="button-group">
                <h:commandButton value="Salvar" action="#{pessoaBean.salvar}" styleClass="btn-salvar" />
                <h:commandButton value="Limpar" action="#{pessoaBean.limpar}" styleClass="btn-limpar" immediate="true" />
            </div>

            <h:panelGroup rendered="#{not empty pessoaBean.nomes}" layout="block" styleClass="mensagem-retorno">
                <h3>Nomes Cadastrados:</h3>
                <ul>
                    <ui:repeat value="#{pessoaBean.nomes}" var="n">
                        <li>#{n}</li>
                    </ui:repeat>
                </ul>
            </h:panelGroup>
        </h:form>
    </div>
</h:body>
</html>
